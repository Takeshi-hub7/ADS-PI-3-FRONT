# Configuracao padrao da aplicacao (vai para o Git; sem segredos).
#
# servico.modo: "mock" usa dados falsos em memoria (sem API);
#               "api" usa o servidor real definido em api.url.
# api.url: endereco base da API (sem barra no final).
# api.timeout.segundos: tempo maximo de espera por uma resposta.
#
# Cada maquina pode sobrescrever estes valores criando o arquivo
# ~/.trajeloc/aplicacao.properties (veja o README).
servico.modo=mock
api.url=http://localhost:8080
api.timeout.segundos=10